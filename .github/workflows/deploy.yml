name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      service_name:
        required: false
        type: string
        description: "Docker-Compose service name"
      port:
        required: false
        type: string
        description: "Service port"

permissions:
  packages: write
  contents: read

jobs:
  deploy:
    uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
    permissions:
      packages: write
      contents: read
    with:
      service_name: ${{ inputs.service_name || 'buchungssatz-agent' }}
      port: ${{ inputs.port || '8504' }}
      app_file: "app/app.py"
    secrets: inherit
